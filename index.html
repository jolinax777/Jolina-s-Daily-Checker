<html lang="zh-TW">
<head>

  if ('serviceWorker' in navigator) {

<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #e8f0f8;
  --surface3: #d0e2f0;
  --wine: #1a5fa8;
  --wine-light: #2a7fd4;
  --wine-glow: rgba(26,95,168,0.15);
  --gold: #0f4c8a;
  --gold-light: #0a3566;
  --text: #0d2137;
  --text2: #2a4a6a;
  --text3: #6a8faa;
  --green: #1a7a5a;
  --green-light: #28a87a;
  --blue: #1a5fa8;
  --blue-light: #2a7fd4;
  --orange: #b35c1a;
  --orange-light: #e07b39;
  --purple: #5a3a9a;
  --purple-light: #8a62cf;
  --radius: 14px;
  --radius-sm: 8px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  overflow-x: hidden;
}
/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--bg) 70%, transparent);
  padding: 16px 20px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title { font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); letter-spacing: 0.02em; }
.app-date { font-size: 0.78rem; color: var(--text3); margin-top: 2px; }
.sync-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--surface3); box-shadow: 0 1px 3px rgba(26,95,168,0.1);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; transition: all 0.2s;
  color: var(--text2);
}
.sync-btn:active { transform: scale(0.9); background: var(--wine); color: white; }
.sync-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ── NAV TABS ── */
.nav-tabs {
  display: flex; overflow-x: auto; gap: 6px;
  padding: 6px 20px 10px;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  flex-shrink: 0; padding: 7px 14px;
  border-radius: 20px; border: 1px solid var(--surface3);
  background: var(--surface); color: var(--text3);
  font-size: 0.82rem; font-weight: 500; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
  font-family: var(--font-body);
}
.nav-tab.active {
  background: var(--wine); border-color: var(--wine-light);
  color: white; box-shadow: 0 2px 10px var(--wine-glow);
}
/* ── MAIN CONTENT ── */
