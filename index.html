<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">
<meta name="theme-color" content="#1a0a0a">
<title>🌊 Jolina's War Room</title>
<link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #e8f0f8;
  --surface3: #d0e2f0;
  --wine: #1a5fa8;
  --wine-light: #2a7fd4;
  --wine-glow: rgba(26,95,168,0.15);
  --gold: #0f4c8a;
  --gold-light: #0a3566;
  --text: #0d2137;
  --text2: #2a4a6a;
  --text3: #6a8faa;
  --green: #1a7a5a;
  --green-light: #28a87a;
  --blue: #1a5fa8;
  --blue-light: #2a7fd4;
  --orange: #b35c1a;
  --orange-light: #e07b39;
  --purple: #5a3a9a;
  --purple-light: #8a62cf;
  --radius: 14px;
  --radius-sm: 8px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--bg) 70%, transparent);
  padding: 16px 20px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title { font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); letter-spacing: 0.02em; }
.app-date { font-size: 0.78rem; color: var(--text3); margin-top: 2px; }
.sync-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--surface3); box-shadow: 0 1px 3px rgba(26,95,168,0.1);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; transition: all 0.2s;
  color: var(--text2);
}
.sync-btn:active { transform: scale(0.9); background: var(--wine); color: white; }
.sync-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── NAV TABS ── */
.nav-tabs {
  display: flex; overflow-x: auto; gap: 6px;
  padding: 6px 20px 10px;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  flex-shrink: 0; padding: 7px 14px;
  border-radius: 20px; border: 1px solid var(--surface3);
  background: var(--surface); color: var(--text3);
  font-size: 0.82rem; font-weight: 500; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
  font-family: var(--font-body);
}
.nav-tab.active {
  background: var(--wine); border-color: var(--wine-light);
  color: white; box-shadow: 0 2px 10px var(--wine-glow);
}

/* ── MAIN CONTENT ── */
.page { display: none; padding: 0 16px; padding-bottom: calc(80px + var(--safe-bottom)); }
.page.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── CARDS ── */
.section-title {
  font-family: var(--font-display); font-size: 1rem; color: var(--wine);
  margin: 16px 0 10px; display: flex; align-items: center; gap: 8px;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--surface3); }

.task-group { margin-bottom: 18px; }
.group-label {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 4px 10px;
  border-radius: 4px; display: inline-flex; align-items: center; gap: 5px;
  margin-bottom: 8px;
}
.group-s1 { background: rgba(224,123,57,0.15); color: var(--orange-light); border-left: 3px solid var(--orange-light); }
.group-s2 { background: rgba(201,168,76,0.12); color: var(--gold); border-left: 3px solid var(--gold); }
.group-s3 { background: rgba(82,183,136,0.12); color: var(--green-light); border-left: 3px solid var(--green-light); }
.group-s4 { background: rgba(155,114,207,0.12); color: var(--purple-light); border-left: 3px solid var(--purple-light); }
.group-other { background: rgba(255,255,255,0.05); color: var(--text3); border-left: 3px solid var(--surface3); }

.task-card {
  background: var(--surface);
  border: 1px solid var(--surface3);
  box-shadow: 0 1px 4px rgba(26,95,168,0.07);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 12px;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.task-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--surface3); border-radius: 3px 0 0 3px;
  transition: background 0.2s;
}
.task-card.doing::before { background: var(--blue-light); }
.task-card.done { opacity: 0.5; }
.task-card.done::before { background: var(--green-light); }
.task-card.urgent::before { background: var(--orange-light); }

.task-check {
  width: 22px; height: 22px; min-width: 22px;
  border-radius: 6px; border: 2px solid var(--surface3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; margin-top: 1px;
  background: transparent;
}
.task-check.checked { background: var(--green); border-color: var(--green-light); }
.task-check.checked::after { content: '✓'; color: var(--green-light); font-size: 0.85rem; font-weight: 700; }

.task-body { flex: 1; min-width: 0; }
.task-name {
  font-size: 0.92rem; font-weight: 500; color: var(--text);
  line-height: 1.4; word-break: break-word;
}
.task-card.done .task-name { text-decoration: line-through; color: var(--text3); }
.task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.meta-badge {
  font-size: 0.7rem; padding: 2px 7px; border-radius: 10px;
  font-weight: 500;
}
.badge-status { background: var(--surface2); color: var(--text3); border: 1px solid var(--surface3); font-weight: 500; }
.badge-priority-1 { background: rgba(198,40,40,0.2); color: #ef5350; }
.badge-priority-2 { background: rgba(230,81,0,0.2); color: var(--orange-light); }
.badge-priority-3 { background: rgba(201,168,76,0.2); color: var(--gold); }
.badge-priority-4 { background: rgba(46,122,79,0.2); color: var(--green-light); }
.badge-tag { background: rgba(74,156,199,0.15); color: var(--blue-light); border: 1px solid rgba(74,156,199,0.2); }
.badge-alert { background: rgba(198,40,40,0.12); color: #c0392b; font-size: 0.72rem; font-weight:600; }
.badge-date { background: rgba(26,95,168,0.1); color: #1a5fa8; border: 1px solid rgba(26,95,168,0.2); }
.badge-lead { background: rgba(90,125,150,0.1); color: #3d5a72; border: 1px solid rgba(90,125,150,0.2); }
.task-alert { font-size: 0.75rem; color: #c0392b; margin-top: 5px; font-weight: 500; }

.task-action-btn {
  background: transparent; border: none; color: var(--text3);
  font-size: 1.1rem; cursor: pointer; padding: 2px 6px;
  border-radius: 6px; transition: all 0.15s;
}
.task-action-btn:active { background: var(--surface3); color: var(--text); }

/* ── QUICK ADD ── */
.quick-add {
  position: sticky; bottom: calc(70px + var(--safe-bottom));
  margin: 0 0 8px; z-index: 50;
}
.quick-add-bar {
  display: flex; gap: 8px; align-items: center;
  background: var(--surface2); border: 1px solid var(--surface3);
  border-radius: 50px; padding: 8px 8px 8px 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.quick-add-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 0.9rem; font-family: var(--font-body);
}
.quick-add-input::placeholder { color: var(--text3); }
.quick-add-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--wine); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; transition: all 0.2s; color: white;
}
.quick-add-btn:active { transform: scale(0.9); background: var(--wine-light); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--surface3); box-shadow: 0 -2px 12px rgba(26,95,168,0.08);
  display: flex; padding-bottom: var(--safe-bottom);
  z-index: 200;
}
.bottom-nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 10px 4px; cursor: pointer;
  color: var(--text3); font-size: 0.65rem; gap: 3px;
  transition: color 0.2s; border: none; background: transparent;
  font-family: var(--font-body);
}
.bottom-nav-item .nav-icon { font-size: 1.3rem; }
.bottom-nav-item.active { color: var(--wine-light); }

/* ── ACTION BUTTONS ── */
.action-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.action-btn {
  flex: 1; min-width: 80px; padding: 10px 12px;
  background: var(--surface2); border: 1px solid var(--surface3);
  border-radius: var(--radius-sm); color: var(--text2);
  font-size: 0.8rem; font-weight: 500; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: all 0.2s; font-family: var(--font-body);
}
.action-btn:active { transform: scale(0.96); background: var(--surface3); }
.action-btn .btn-icon { font-size: 1.3rem; }

/* ── MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(13,33,55,0.4); z-index: 300;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
.modal {
  background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -4px 24px rgba(26,95,168,0.12);
  width: 100%; max-height: 90dvh; overflow-y: auto;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  border-top: 1px solid var(--surface3); box-shadow: 0 -2px 12px rgba(26,95,168,0.08);
}
.modal-handle { width: 40px; height: 4px; background: var(--surface3); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--gold-light); margin-bottom: 16px; }

.form-group { margin-bottom: 14px; }
.form-label { font-size: 0.78rem; color: var(--text3); margin-bottom: 6px; display: block; font-weight: 500; letter-spacing: 0.03em; }
.form-input, .form-select, .form-textarea {
  width: 100%; background: var(--surface3);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm); padding: 11px 14px;
  color: var(--text); font-size: 0.9rem;
  font-family: var(--font-body); outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--wine-light);
}
.form-select option { background: var(--surface2); }
.form-textarea { min-height: 80px; resize: none; }

.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

.btn-primary {
  width: 100%; padding: 14px;
  background: var(--wine); border: none; border-radius: var(--radius-sm);
  color: white; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; font-family: var(--font-body);
  margin-top: 8px;
}
.btn-primary:active { background: var(--wine-light); transform: scale(0.98); }
.btn-secondary {
  width: 100%; padding: 12px;
  background: transparent; border: 1px solid var(--surface3);
  border-radius: var(--radius-sm); color: var(--text3);
  font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
  font-family: var(--font-body); margin-top: 6px;
}
.btn-secondary:active { background: var(--surface3); }

/* ── SHOPPING ── */
.shop-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; background: var(--surface);
  border: 1px solid var(--surface3); border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.shop-item-name { flex: 1; font-size: 0.9rem; color: var(--text2); }
.shop-done-btn {
  background: transparent; border: none; font-size: 1.1rem;
  cursor: pointer; color: var(--text3); transition: all 0.2s;
  padding: 4px;
}
.shop-done-btn:active { color: var(--green-light); transform: scale(1.2); }

/* ── JOURNAL ── */
.journal-status-row { display: flex; gap: 8px; margin-bottom: 14px; }
.status-option {
  flex: 1; padding: 10px; border-radius: var(--radius-sm);
  border: 2px solid var(--surface3); text-align: center;
  cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
  background: var(--surface);
}
.status-option.selected { border-color: var(--wine-light); background: var(--wine-glow); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(90px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface2); border: 1px solid var(--surface3);
  border-radius: 20px; padding: 10px 18px;
  font-size: 0.85rem; color: var(--text);
  z-index: 500; opacity: 0; transition: all 0.3s;
  white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── LOADING ── */
.loading { text-align: center; padding: 40px 20px; color: var(--text3); }
.loading-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin: 0 3px; animation: bounce 1.2s infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

/* ── HABIT ── */
.habit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.habit-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--surface3);
  border-radius: var(--radius-sm); padding: 11px 12px;
  cursor: pointer; transition: all 0.2s;
}
.habit-item.checked { background: rgba(45,106,79,0.2); border-color: var(--green-light); }
.habit-check-icon { font-size: 1rem; width: 20px; text-align: center; }
.habit-label { font-size: 0.82rem; color: var(--text2); flex: 1; }
.habit-item.checked .habit-label { color: var(--green-light); }

.habit-section-title { font-size: 0.75rem; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 0 8px; }

/* ── EMPTY ── */
.empty-state { text-align: center; padding: 40px 20px; }
.empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
.empty-text { color: var(--text3); font-size: 0.9rem; }

/* ── CALENDAR ── */
.cal-day {
  padding: 8px 14px; background: var(--surface);
  border: 1px solid var(--surface3); border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.cal-day-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.cal-day-num { font-family: var(--font-display); font-size: 1.1rem; color: var(--gold); min-width: 28px; }
.cal-day-label { font-size: 0.78rem; color: var(--text3); }
.cal-day-holiday { font-size: 0.7rem; color: #ef9a9a; background: rgba(198,40,40,0.15); padding: 1px 6px; border-radius: 4px; }
.cal-task-chip {
  display: inline-block; font-size: 0.75rem;
  padding: 2px 8px; border-radius: 10px; margin: 2px 3px 2px 0;
  background: var(--surface2); color: var(--text2);
}
.cal-task-chip.done { text-decoration: line-through; opacity: 0.5; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
::-webkit-scrollbar-track { background: var(--bg); }

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div>
    <div class="app-title">🌊 War Room</div>
    <div class="app-date" id="headerDate"></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="sync-btn" onclick="resetToken()" title="重設Token" style="font-size:0.7rem;">⚙️</button>
    <button class="sync-btn" id="syncBtn" onclick="syncAll()" title="重新整理">↻</button>
  </div>
</header>

<!-- NAV TABS (for daily page sub-tabs) -->
<div class="nav-tabs" id="subTabs" style="display:none;">
  <button class="nav-tab active" onclick="switchSubTab('tasks',this)">🛡️ 每日任務</button>
  <button class="nav-tab" onclick="switchSubTab('journal',this)">✍️ 晨間反思</button>
  <button class="nav-tab" onclick="switchSubTab('habits',this)">🧘 習慣打卡</button>
</div>

<!-- PAGES -->
<main>

  <!-- PAGE: DAILY -->
  <div class="page active" id="page-daily">

    <!-- Action Buttons -->
    <div class="action-row" style="margin-top:8px;">
      <button class="action-btn" onclick="actionNewDay()">
        <span class="btn-icon">🌅</span>
        <span>開啟今天</span>
      </button>
      <button class="action-btn" onclick="actionMoveToday()">
        <span class="btn-icon">↩️</span>
        <span>移至今日</span>
      </button>
      <button class="action-btn" onclick="actionArchive()">
        <span class="btn-icon">📦</span>
        <span>智慧封存</span>
      </button>
    </div>

    <!-- Sub: Tasks -->
    <div id="sub-tasks">
      <div class="section-title">今日作戰計畫</div>
      <div id="taskList"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
    </div>

    <!-- Sub: Journal -->
    <div id="sub-journal" class="hidden">
      <div class="section-title">今日日記</div>
      <div id="journalContent"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
    </div>

    <!-- Sub: Habits -->
    <div id="sub-habits" class="hidden">
      <div class="section-title">習慣打卡</div>
      <div id="habitContent"><div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div>
    </div>

    <!-- Quick Add -->
    <div class="quick-add" id="quickAdd">
      <div class="quick-add-bar">
        <input class="quick-add-input" id="quickAddInput" placeholder="快速新增任務..." type="text">
        <button class="quick-add-btn" onclick="quickAddTask()">＋</button>
      </div>
    </div>
  </div>

  <!-- PAGE: ADD TASK -->
  <div class="page" id="page-add">
    <div class="section-title" style="margin-top:8px;">新增任務</div>
    <div class="form-group">
      <label class="form-label">分類</label>
      <input class="form-input" id="f_category" placeholder="例如：工作、打掃..." value="任務">
    </div>
    <div class="form-group">
      <label class="form-label">任務內容 *</label>
      <input class="form-input" id="f_body" placeholder="要做什麼？">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">執行日期</label>
        <input class="form-input" id="f_date" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">類型</label>
        <select class="form-select" id="f_type">
          <option value="🟧S1－Urgent 緊急任務">🟧 S1 緊急</option>
          <option value="🟨S2－Deadline 期限任務">🟨 S2 期限</option>
          <option value="🟩S3－Admin 行政任務" selected>🟩 S3 行政</option>
          <option value="🟪S4－Creative 專案任務">🟪 S4 專案</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">優先級</label>
        <select class="form-select" id="f_priority">
          <option value="🔴1級－Urgent ＆ Important！">🔴 1級</option>
          <option value="🟠2級－Not Urgent but Important">🟠 2級</option>
          <option value="🟡3級－Urgent but not Important" selected>🟡 3級</option>
          <option value="🟢4級－Not Urgent ＆ not Important">🟢 4級</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">預估時間</label>
        <select class="form-select" id="f_time">
          <option>≦1小時</option>
          <option>1~2小時</option>

function today() {
  return new Date().toISOString().split('T')[0];
}
function todayFormatted() {
  const d = new Date();
  const days = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}`;
}

async function notionFetch(url, options) {
  // Try multiple CORS proxies
  const proxies = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${u}`,
  ];
  let lastErr;
  for (const makeUrl of proxies) {
    try {
      const r = await fetch(makeUrl(url), { ...options, headers: getHeaders() });
      const text = await r.text();
      const data = JSON.parse(text);
      if (data && (data.object || data.results !== undefined)) return data;
      lastErr = new Error(data.message || 'Bad response');
    } catch(e) { lastErr = e; continue; }
  }
  throw lastErr || new Error('All proxies failed');
}

async function notionQuery(dbId, filter, sorts) {
  const body = {};
  if (filter) body.filter = filter;
  if (sorts) body.sorts = sorts;
  return notionFetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
    method: 'POST', body: JSON.stringify(body)
  });
}

async function notionCreate(dbId, properties) {
  return notionFetch('https://api.notion.com/v1/pages', {
    method: 'POST',
    body: JSON.stringify({ parent: { database_id: dbId }, properties })
  });
}

async function notionUpdate(pageId, properties) {
  return notionFetch(`https://api.notion.com/v1/pages/${pageId}`, {
    method: 'PATCH', body: JSON.stringify({ properties })
  });
}

function getProp(props, name, type) {
  try {
    const p = props[name];
    if (!p) return null;
    if (type === 'title') return p.title?.[0]?.plain_text || null;
    if (type === 'rich_text') return p.rich_text?.[0]?.plain_text || null;
    if (type === 'select') return p.select?.name || null;
    if (type === 'status') return p.status?.name || null;
    if (type === 'date') return p.date?.start || null;
    if (type === 'checkbox') return p.checkbox || false;
    if (type === 'number') return p.number;
    if (type === 'multi_select') return p.multi_select?.map(x => x.name) || [];
    if (type === 'formula_str') return p.formula?.string || '';
    if (type === 'formula_date') return p.formula?.date?.start || null;
    if (type === 'rollup_date') {
      if (p.rollup?.date?.start) return p.rollup.date.start;
      const arr = p.rollup?.array || [];
      if (arr.length > 0) {
        if (arr[0].date?.start) return arr[0].date.start;
        if (arr[0].formula?.date?.start) return arr[0].formula.date.start;
      }
      return null;
    }
  } catch { return null; }
}

function fmtDate(d) {
  if (!d) return null;
  return d.split('T')[0];
}

async function loadTasks() {
  const el = document.getElementById('taskList');
  el.innerHTML = '<div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
  try {
    const data = await notionQuery(DB.TASK, {
      and: [
        { property: 'Due 排程執行日', date: { equals: today() } },
        { property: 'Archive 封存', checkbox: { equals: false } }
      ]
    });

    const groups = { S1: [], S2: [], S3: [], S4: [], Other: [] };
    for (const page of data.results || []) {
      const p = page.properties;
      const name = getProp(p, 'Tasks Name', 'title') || '未命名';
      const status = getProp(p, 'Status 任務階段', 'status') || getProp(p, 'Status 任務階段', 'select') || '🧋未開始';
      const typeRaw = getProp(p, 'Type 任務類型', 'select') || '';
      const priority = getProp(p, 'Priority 任務優先值', 'select') || '';
      const tags = getProp(p, 'Tags 任務隸屬', 'multi_select') || [];
      // Helper: extract any date string from unknown structure
      function extractDate(obj) {
        if (!obj) return null;
        const str = JSON.stringify(obj);
        const match = str.match(/"(\d{4})[\/-](\d{2})[\/-](\d{2})"/);
        if (match) return `${match[1]}-${match[2]}-${match[3]}`;
        return null;
      }

      // autoDue: Automatic Due 安全截止日 (formula → string with date)
      const autoDueRaw = p['Automatic Due 安全截止日'];
      let autoDue = null;
      if (autoDueRaw?.formula?.string) {
        const m = autoDueRaw.formula.string.match(/(\d{4})[\/-](\d{2})[\/-](\d{2})/);
        if (m) autoDue = `${m[1]}-${m[2]}-${m[3]}`;
      }
      if (!autoDue) autoDue = extractDate(autoDueRaw?.formula?.date || autoDueRaw?.date);

      // taskDue: Task Deadline 任務截止日 (date field)
      const taskDue = fmtDate(p['Task Deadline 任務截止日']?.date?.start);

      // projDue: Project Deadline 專案截止日 (rollup from project DB)
      const projDueRaw = p['Project Deadline 專案截止日'];
      let projDue = null;
      if (projDueRaw?.rollup?.date?.start) {
        projDue = fmtDate(projDueRaw.rollup.date.start);
      } else if (projDueRaw?.rollup?.array) {
        for (const item of (projDueRaw.rollup.array || [])) {
          const d = item.date?.start || item.formula?.date?.start;
          if (d) { projDue = fmtDate(d); break; }
          const m = (item.formula?.string || '').match(/(\d{4})[\/-](\d{2})[\/-](\d{2})/);
          if (m) { projDue = `${m[1]}-${m[2]}-${m[3]}`; break; }
        }
      }
      if (!projDue) projDue = extractDate(projDueRaw?.rollup);

      // leadDays: Lead Day 安全準備時間 (number)
      const leadDays = p['Lead Day 安全準備時間']?.number || null;

      // alert: formula string, only show if meaningful
      const alertRaw = p['AI Due date 安全截止日概覽'];
      const alertStr = alertRaw?.formula?.string || '';
      const alert = (alertStr && !alertStr.includes('No Deadline') && !alertStr.includes('暫無') && !alertStr.includes('On Track') && !alertStr.includes('計算時限')) ? alertStr : '';

      let group = 'Other';
      if (typeRaw.includes('S1')) group = 'S1';
      else if (typeRaw.includes('S2')) group = 'S2';
      else if (typeRaw.includes('S3')) group = 'S3';
      else if (typeRaw.includes('S4')) group = 'S4';

      groups[group].push({ id: page.id, name, status, priority, tags, alert });
    }

    const groupLabels = {
      S1: ['group-s1', '🟧 S1 緊急'],
      S2: ['group-s2', '🟨 S2 期限'],
      S3: ['group-s3', '🟩 S3 行政'],
      S4: ['group-s4', '🟪 S4 專案'],
      Other: ['group-other', '☁️ 其他']
    };

    let html = '';
    let total = 0;
    for (const [key, tasks] of Object.entries(groups)) {
      if (!tasks.length) continue;
      total += tasks.length;
      const [cls, label] = groupLabels[key];
      html += `<div class="task-group">
        <div class="group-label ${cls}">${label} <span style="opacity:0.6">${tasks.length}</span></div>`;
      
      // Sort: doing first, done last
      tasks.sort((a,b) => {
        const order = s => s.includes('進行中') ? 0 : s.includes('已完成') || s.includes('已放棄') ? 2 : 1;
        return order(a.status) - order(b.status);
      });

      for (const t of tasks) {
        const isDone = t.status.includes('已完成');
        const isDoing = t.status.includes('進行中');
        const cardClass = isDone ? 'done' : (isDoing ? 'doing' : (key==='S1' ? 'urgent' : ''));
        
        let prioClass = '';
        if (t.priority.includes('1級')) prioClass = 'badge-priority-1';
        else if (t.priority.includes('2級')) prioClass = 'badge-priority-2';
        else if (t.priority.includes('3級')) prioClass = 'badge-priority-3';
        else if (t.priority.includes('4級')) prioClass = 'badge-priority-4';

        const prioShort = t.priority.split('－')[0] || '';
        const tagsHtml = t.tags.map(tag => `<span class="meta-badge badge-tag">${tag}</span>`).join('');
        const alertHtml = t.alert && !t.alert.includes('No Deadline') && !t.alert.includes('暫無')
          ? `<span class="meta-badge badge-alert">⚠️ ${t.alert}</span>` : '';
        const statusShort = t.status.replace(/[🍶🥛☕🍷🧋🍵]/g,'').trim();

        // Build date badges
        const dates = [t.autoDue, t.taskDue, t.projDue].filter(Boolean);
        const uniqueDates = [...new Set(dates)];
        const datesHtml = uniqueDates.length
          ? `<span class="meta-badge badge-date">📅 ${uniqueDates.join(' ｜ ')}</span>` : '';
        const leadHtml = t.leadDays && t.leadDays > 0
          ? `<span class="meta-badge badge-lead">🛡️ ${t.leadDays}天</span>` : '';

        html += `
<div class="task-card ${cardClass}" id="card-${t.id}">
  <div class="task-check ${isDone ? 'checked' : ''}" onclick="toggleDone('${t.id}', ${isDone}, '${t.status.replace(/'/g,"\\'")}')"></div>
  <div class="task-body">
    <div class="task-name">${t.name}</div>
    <div class="task-meta">
      ${prioShort ? `<span class="meta-badge ${prioClass}">${prioShort}</span>` : ''}
      <span class="meta-badge badge-status">${statusShort}</span>
      ${tagsHtml}
      ${alertHtml}
    </div>
  </div>
  <button class="task-action-btn" onclick="openTaskModal('${t.id}','${t.name.replace(/'/g,"\\'")}','${t.status.replace(/'/g,"\\'")}')">⋯</button>
</div>`;
      }
      html += '</div>';
    }

    if (!total) {
      html = `<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">今天沒有排程任務！</div></div>`;
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">載入失敗，請重新整理<br><small>${e.message}</small></div></div>`;
  }
}

async function actionMoveToday() {
  showToast('↩️ 移動中...');

  const data = await notionQuery(DB.TASK, {
    and: [
      { property: 'Archive 封存', checkbox: { equals: false } },
      { property: 'Due 排程執行日', date: { before: t } },
      { property: 'Status 任務階段', status: { does_not_equal: '🍵已完成' } },
      { property: 'Status 任務階段', status: { does_not_equal: '🍷已放棄' } }
    ]
  });

  for (const page of data.results || []) {

  }

async function actionArchive() {
  showToast('📦 整理中...');
  const data = await notionQuery(DB.TASK, { property: 'Archive 封存', checkbox: { equals: false } });
  let archived = 0;
  for (const page of data.results || []) {
    const p = page.properties;
    const status = getProp(p, 'Status 任務階段', 'status') || getProp(p, 'Status 任務階段', 'select') || '';

async function loadShopping() {
  const el = document.getElementById('shopList');

  try {
    const data = await notionQuery(DB.SHOPPING, { property: '封存', checkbox: { equals: false } });

    for (const page of data.results || []) {
      const p = page.properties;
      const name = getProp(p, '採買物品', 'title') || '未命名';
      const urgency = getProp(p, '急迫性', 'select') || '';

async function loadHabits() {
  const el = document.getElementById('habitContent');
  el.innerHTML = '<div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';
  try {
    const data = await notionQuery(DB.HABIT, { property: '日期', date: { equals: today() } });
    if (!data.results?.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🧘</div><div class="empty-text">今天還沒有習慣記錄<br>請先點「開啟今天」建立</div></div>`;
      return;
    }
    const page = data.results[0];
    habitPageId = page.id;
    const p = page.properties;
    habitData = {};
    for (const h of HABITS) {
      habitData[h.key] = p[h.key]?.checkbox || false;
    }

    const sections = {};
    for (const h of HABITS) {
      if (!sections[h.section]) sections[h.section] = [];
      sections[h.section].push(h);
    }

    let html = '';
    for (const [sec, items] of Object.entries(sections)) {
      html += `<div class="habit-section-title">${sec}</div><div class="habit-grid">`;
      for (const h of items) {
        const checked = habitData[h.key];
        html += `<div class="habit-item ${checked?'checked':''}" id="habit-${h.key.replace(/[^a-zA-Z0-9]/g,'_')}" onclick="toggleHabit('${h.key.replace(/'/g,"\\'")}', this)">
          <span class="habit-check-icon">${checked ? '✅' : '⬜'}</span>
          <span class="habit-label">${h.icon} ${h.label}</span>
        </div>`;
      }
      html += '</div>';
    }
    html += `<button class="btn-primary" onclick="saveHabits()" style="margin-top:16px;">💾 儲存打卡</button>`;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">載入失敗</div></div>`;
  }
}

function toggleHabit(key, el) {
  habitData[key] = !habitData[key];
  el.classList.toggle('checked', habitData[key]);
  el.querySelector('.habit-check-icon').textContent = habitData[key] ? '✅' : '⬜';
  el.querySelector('.habit-label').style.color = habitData[key] ? 'var(--green-light)' : '';
}

async function saveHabits() {
  if (!habitPageId) return;
  showToast('💾 儲存中...');
  const updates = {};
  for (const h of HABITS) {
    updates[h.key] = { checkbox: habitData[h.key] || false };
  }
  await notionUpdate(habitPageId, updates);
  showToast('🎉 習慣已儲存！');
}

// ═══════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════
const DAYS_TW = ['日','一','二','三','四','五','六'];
const MONTHS_TW = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function calPrev() { calOffset--; loadCalendar(); }
function calNext() { calOffset++; loadCalendar(); }

async function loadCalendar() {
  const el = document.getElementById('calContent');
  el.innerHTML = '<div class="loading"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>';

  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const year = target.getFullYear();
  const month = target.getMonth();
  document.getElementById('calTitle').textContent = `${year} 年 ${MONTHS_TW[month]}`;

  const startDate = new Date(year, month, 1);
  const endDate = new Date(year, month + 1, 0);
  const startStr = startDate.toISOString().split('T')[0];
  const endStr = endDate.toISOString().split('T')[0];

  try {
    const data = await notionQuery(DB.TASK, {
      and: [
        { property: 'Due 排程執行日', date: { on_or_after: startStr } },
        { property: 'Due 排程執行日', date: { on_or_before: endStr } },
        { property: 'Status 任務階段', status: { does_not_equal: '🍷已放棄' } }
      ]
    });

    const taskMap = {};
    for (const page of data.results || []) {
      const p = page.properties;
      const due = getProp(p, 'Due 排程執行日', 'date');
      if (!due) continue;
      const dateKey = due.split('T')[0];
      const name = getProp(p, 'Tasks Name', 'title') || '未命名';
      const status = getProp(p, 'Status 任務階段', 'status') || '';
      const isDone = status.includes('已完成');
      if (!taskMap[dateKey]) taskMap[dateKey] = [];
      taskMap[dateKey].push({ name, isDone });
    }

    let html = '';
    const todayStr = new Date().toISOString().split('T')[0];

    for (let d = 1; d <= endDate.getDate(); d++) {
      const date = new Date(year, month, d);
      const dateStr = date.toISOString().split('T')[0];
      const dayOfWeek = date.getDay();
      const isToday = dateStr === todayStr;
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const holiday = HOLIDAYS[dateStr] || '';
      const tasks = taskMap[dateStr] || [];

      const bgStyle = isToday ? 'border-color: var(--wine); background: rgba(139,26,26,0.1);' :
                      holiday ? 'background: rgba(198,40,40,0.05);' :
                      isWeekend ? 'background: rgba(74,156,199,0.05);' : '';

      html += `<div class="cal-day" style="${bgStyle}">
        <div class="cal-day-header">
          <span class="cal-day-num" style="${isToday?'color:var(--wine-light)':''}">${d}</span>
          <span class="cal-day-label">星期${DAYS_TW[dayOfWeek]}</span>
          ${holiday ? `<span class="cal-day-holiday">${holiday}</span>` : ''}
          ${isToday ? '<span style="font-size:0.7rem;color:var(--wine-light);font-weight:700;">TODAY</span>' : ''}
        </div>`;
      if (tasks.length) {
        html += '<div>';
        for (const t of tasks.slice(0, 4)) {
          const shortName = t.name.length > 20 ? t.name.slice(0,20)+'…' : t.name;
          html += `<span class="cal-task-chip ${t.isDone?'done':''}">${t.isDone?'✓ ':''}${shortName}</span>`;
        }
        if (tasks.length > 4) html += `<span class="cal-task-chip">+${tasks.length-4} 更多</span>`;
        html += '</div>';
      }
      html += '</div>';
    }

    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">載入失敗</div></div>`;
  }
}

// ═══════════════════════════════════════
// SETUP
// ═══════════════════════════════════════
function showSetup() {
  document.getElementById('setupScreen').style.display = 'block';
}
function hideSetup() {
  document.getElementById('setupScreen').style.display = 'none';
}

async function saveSetup() {
  const input = document.getElementById('setupToken').value.trim();
  if (!input) return;
  const btn = document.querySelector('#setupScreen .btn-primary');
  btn.textContent = '驗證中...';
  btn.disabled = true;

  // Test the token
  try {
    // Try proxies for validation
    const testProxies = [
      u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
      u => `https://thingproxy.freeboard.io/fetch/${u}`,
      u => `https://api.codetabs.com/v1/proxy?quest=${u}`,
    ];
    const testUrl = `https://api.notion.com/v1/databases/${DB.TASK}/query`;
    const testHeaders = {
      'Authorization': `Bearer ${input}`,
      'Notion-Version': '2022-06-28',
      'Content-Type': 'application/json'
    };
    let testData = null;
    for (const makeUrl of testProxies) {
      try {
        const res = await fetch(makeUrl(testUrl), { method: 'POST', headers: testHeaders, body: JSON.stringify({}) });
        const text = await res.text();
        testData = JSON.parse(text);
        if (testData && (testData.object || testData.results !== undefined)) break;
        testData = null;
      } catch(e) { testData = null; continue; }
    }
    if (!testData) throw new Error('All proxies failed');
    const data = testData;
    if (testData.object === 'error') throw new Error(testData.message);
    
    TOKEN = input;
    localStorage.setItem('notion_token', input);
    hideSetup();
    initApp();
  } catch(e) {
    document.getElementById('setupError').style.display = 'block';
    btn.textContent = '🚀 開始使用';
    btn.disabled = false;
  }
}

function resetToken() {
  localStorage.removeItem('notion_token');
  TOKEN = '';
  showSetup();
}

function initApp() {
  document.getElementById('headerDate').textContent = todayFormatted();
  document.getElementById('f_date').value = today();
  document.getElementById('subTabs').style.display = 'flex';
  loadTasks();
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    setTimeout(() => showToast('💡 點選瀏覽器選單「加入主畫面」即可安裝！', 4000), 2000);
  });
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
if (!TOKEN) {
  showSetup();
} else {
  initApp();
}
