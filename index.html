<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">

<title>🌊 Jolina's War Room</title>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));

<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface2: #e8f0f8;
  --surface3: #d0e2f0;
  --wine: #1a5fa8;
  --wine-light: #2a7fd4;
  --wine-glow: rgba(26,95,168,0.15);
  --gold: #0f4c8a;
  --gold-light: #0a3566;
  --text: #0d2137;
  --text2: #2a4a6a;
  --text3: #6a8faa;
  --green: #1a7a5a;
  --green-light: #28a87a;
  --blue: #1a5fa8;
  --blue-light: #2a7fd4;
  --orange: #b35c1a;
  --orange-light: #e07b39;
  --purple: #5a3a9a;
  --purple-light: #8a62cf;
  --radius: 14px;
  --radius-sm: 8px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--bg) 70%, transparent);
  padding: 16px 20px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title { font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); letter-spacing: 0.02em; }
.app-date { font-size: 0.78rem; color: var(--text3); margin-top: 2px; }
.sync-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--surface3); box-shadow: 0 1px 3px rgba(26,95,168,0.1);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; transition: all 0.2s;
  color: var(--text2);
}
.sync-btn:active { transform: scale(0.9); background: var(--wine); color: white; }
.sync-btn.spinning { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── NAV TABS ── */
.nav-tabs {
  display: flex; overflow-x: auto; gap: 6px;
  padding: 6px 20px 10px;
  scrollbar-width: none;
}
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab {
  flex-shrink: 0; padding: 7px 14px;
  border-radius: 20px; border: 1px solid var(--surface3);
  background: var(--surface); color: var(--text3);
  font-size: 0.82rem; font-weight: 500; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
  font-family: var(--font-body);
}
.nav-tab.active {
  background: var(--wine); border-color: var(--wine-light);
  color: white; box-shadow: 0 2px 10px var(--wine-glow);
}

/* ── MAIN CONTENT ── */
.page { display: none; padding: 0 16px; padding-bottom: calc(80px + var(--safe-bottom)); }
.page.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── CARDS ── */
.section-title {
  font-family: var(--font-display); font-size: 1rem; color: var(--wine);
  margin: 16px 0 10px; display: flex; align-items: center; gap: 8px;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--surface3); }

.task-group { margin-bottom: 18px; }
.group-label {
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 4px 10px;
  border-radius: 4px; display: inline-flex; align-items: center; gap: 5px;
  margin-bottom: 8px;
}
.group-s1 { background: rgba(224,123,57,0.15); color: var(--orange-light); border-left: 3px solid var(--orange-light); }
.group-s2 { background: rgba(201,168,76,0.12); color: var(--gold); border-left: 3px solid var(--gold); }
.group-s3 { background: rgba(82,183,136,0.12); color: var(--green-light); border-left: 3px solid var(--green-light); }
.group-s4 { background: rgba(155,114,207,0.12); color: var(--purple-light); border-left: 3px solid var(--purple-light); }
.group-other { background: rgba(255,255,255,0.05); color: var(--text3); border-left: 3px solid var(--surface3); }

.task-card {
  background: var(--surface);
  border: 1px solid var(--surface3);
  box-shadow: 0 1px 4px rgba(26,95,168,0.07);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 12px;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.task-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--surface3); border-radius: 3px 0 0 3px;
  transition: background 0.2s;
}
.task-card.doing::before { background: var(--blue-light); }
.task-card.done { opacity: 0.5; }
.task-card.done::before { background: var(--green-light); }
.task-card.urgent::before { background: var(--orange-light); }

.task-check {
  width: 22px; height: 22px; min-width: 22px;
  border-radius: 6px; border: 2px solid var(--surface3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; margin-top: 1px;
  background: transparent;
}
.task-check.checked { background: var(--green); border-color: var(--green-light); }
.task-check.checked::after { content: '✓'; color: var(--green-light); font-size: 0.85rem; font-weight: 700; }

.task-body { flex: 1; min-width: 0; }
.task-name {
  font-size: 0.92rem; font-weight: 500; color: var(--text);
  line-height: 1.4; word-break: break-word;
}
.task-card.done .task-name { text-decoration: line-through; color: var(--text3); }
.task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.meta-badge {
  font-size: 0.7rem; padding: 2px 7px; border-radius: 10px;
  font-weight: 500;
}
.badge-status { background: var(--surface2); color: var(--text3); border: 1px solid var(--surface3); font-weight: 500; }
.badge-priority-1 { background: rgba(198,40,40,0.2); color: #ef5350; }
.badge-priority-2 { background: rgba(230,81,0,0.2); color: var(--orange-light); }
.badge-priority-3 { background: rgba(201,168,76,0.2); color: var(--gold); }
.badge-priority-4 { background: rgba(46,122,79,0.2); color: var(--green-light); }
.badge-tag { background: rgba(74,156,199,0.15); color: var(--blue-light); border: 1px solid rgba(74,156,199,0.2); }
.badge-alert { background: rgba(198,40,40,0.12); color: #c0392b; font-size: 0.72rem; font-weight:600; }
.badge-date {
